name: Check Repository Files

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  check-files:
    name: 检查仓库文件
    runs-on: ubuntu-latest

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 查看当前目录
        run: |
          pwd
          ls -la

      - name: 检查 README.md 是否存在
        run: |
          if [ -f README.md ]; then
            echo "README.md 存在"
            cat README.md
          else
            echo "README.md 不存在"
            exit 1
          fi
